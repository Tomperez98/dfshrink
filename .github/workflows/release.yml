# Build once without credentials, publish the same bytes from a protected job,
# then verify from the outside. Triggered by a version tag; see RELEASING.md
# for the checklist.
name: release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  # Only one release at a time, and a running release is never cancelled.
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: build (no credentials)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      # No dependency install: `uv build` is isolated, and this job holds no
      # credentials. It only produces the artifacts.
      - run: python scripts/release.py build --out-dir dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 90

  publish:
    name: publish (protected)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/dfshrink
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      # Check out the tagged commit explicitly, whatever ref started the run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      # No caches, and no dependency install: the only credentialed step uploads
      # bytes this job did not build. Every precondition is re-checked here,
      # after the approval, right before the first upload. The token is mapped
      # explicitly: Actions does not export GITHUB_TOKEN to steps on its own.
      - run: python scripts/release.py publish --manifest dist/release.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

  verify:
    name: verify from PyPI (Python ${{ matrix.python }})
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Every supported version reports its own result; one failure must not
      # cancel the others.
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    permissions:
      contents: read
    steps:
      # Validation code comes from main; only the artifacts come from the
      # release. The matrix installs the built wheel and sdist on every
      # supported Python version, not just the one the runner happens to run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - run: python scripts/release.py verify --manifest dist/release.json --expect-latest --python "${{ matrix.python }}"

  release:
    name: publish GitHub release notes
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # The changelog and script come from the tagged commit; the manifest
      # identifies the version to announce. Runs only after verify confirms
      # what actually shipped.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - run: python scripts/release.py release --manifest dist/release.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
