# Post-merge: run the full Python matrix per commit. The merge gate (ci.yml)
# runs one Python to stay fast; this catches version-specific breakages the
# moment a commit lands, before the weekly monitor or a release. Failures open
# an issue so they reach a person (via the shared notify.yml).
name: matrix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Every version reports its own result; a 3.14 failure must not cancel 3.12.
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - run: mise run setup
      - run: mise run test-py "${{ matrix.python }}"

  notify:
    name: open an issue on failure
    needs: test
    if: failure()
    permissions:
      issues: write
    uses: ./.github/workflows/notify.yml
    with:
      title: "matrix: post-merge check failed"
      summary: A post-merge matrix run failed.
