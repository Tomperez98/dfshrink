# Re-check what we do not control on a schedule. The per-commit Python matrix
# lives in matrix.yml. Failures open an issue so they reach a person (via the
# shared notify.yml).
name: monitor

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  verify-latest:
    name: re-verify the published release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      # Downloading and installing from PyPI is what a user does; a package
      # that disappeared or broke surfaces here before a user reports it.
      - run: mise run verify-latest

  notify:
    name: open an issue on failure
    needs: [verify-latest]
    if: failure()
    permissions:
      issues: write
    uses: ./.github/workflows/notify.yml
    with:
      title: "monitor: scheduled check failed"
      summary: A scheduled monitor run failed.
