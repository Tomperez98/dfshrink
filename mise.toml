# Every task a developer or CI runs lives here, so `mise run ci` is the same
# command on a laptop and on a runner. Tool versions are pinned by
# `.python-version` and `[tool.uv] required-version`; this file is tasks only.

[tasks.setup]
description = "Install the pinned toolchain and every dependency"
run = '''
if [ -n "${CI:-}" ]; then
  uv sync --all-extras --dev --locked
else
  uv sync --all-extras --dev
fi
'''

[tasks.format]
description = "Check formatting"
run = "uv run ruff format --check ."

[tasks.lint]
description = "Lint, including banned APIs"
run = "uv run ruff check ."

[tasks.type]
description = "Type-check at the strictest settings (diagnostics are errors)"
run = "uv run ty check"

[tasks.orphans]
description = "Fail on source files outside the declared package"
run = "uv run python scripts/check_orphans.py"

[tasks.links]
description = "Fail on broken repo-local Markdown links"
run = "uv run python scripts/check_links.py"

[tasks.check]
description = "Repo hygiene: no orphans, no broken links"
depends = ["orphans", "links"]

[tasks.test]
description = "Run the unit test suite"
run = "uv run pytest"

[tasks.test-matrix]
description = "Run the suite across every supported Python version (local; mirrors matrix.yml)"
run = '''
for py in 3.12 3.13 3.14; do
  echo "--- python $py"
  uv run --python "$py" --all-extras pytest
done
'''

[tasks.test-py]
description = "Run the suite on one Python version (a matrix.yml cell)"
usage = 'arg "<py>" help="Python version, e.g. 3.14"'
run = "uv run --python \"$usage_py\" --all-extras pytest"

[tasks.examples]
description = "Run every example the docs promise works"
run = '''
for example in examples/*.py; do
  echo "--- $example"
  uv run python "$example"
done
'''

[tasks.build]
description = "Dry-run the release build; needs no credentials"
run = "uv run --no-sync python scripts/release.py build --out-dir dist"

[tasks.smoke]
description = "Install the built wheel and sdist into clean venvs and smoke-test each"
depends = ["build"]
run = "uv run --no-sync python scripts/release.py smoke --manifest dist/release.json"

[tasks.ci]
description = "The merge gate: every tier, cheapest first; the first failure stops the run"
run = '''
set -e
# Sequential and cheap-first: the first failing tier stops the run.
for tier in format lint type check test examples smoke; do
  echo "=== $tier"
  mise run "$tier"
done
'''

[tasks."release:publish"]
description = "Upload a built release; protected job only"
run = "uv run --no-sync python scripts/release.py publish --manifest dist/release.json"

[tasks."release:verify"]
description = "Install the published release from PyPI and smoke-test it"
run = "uv run --no-sync python scripts/release.py verify --manifest dist/release.json --expect-latest"

[tasks.verify-latest]
description = "Install the newest published release and smoke-test it (scheduled)"
run = "uv run --no-sync python scripts/release.py verify --latest --venv-dir .smoke"

[tasks.bump]
description = "Derive the next version (patch + 1) from the changelog and edit the changelog"
run = "uv run --no-sync python scripts/release.py bump"

[tasks.changelog]
description = "List merged changes since the last tag, to edit into CHANGELOG.md"
run = "uv run --no-sync python scripts/release.py changelog"
